# ComSense Firewall Manager as a Portainer stack behind an external HTTPS proxy
# (NetBird reverse proxy, Nginx Proxy Manager, Traefik, ...).
#
# Portainer: Stacks > Add stack > Repository, compose path deploy/portainer-stack.yml,
# and set the environment variables below. Portainer builds the app image from
# server/ in this repository.
#
# Two listeners:
#   Web console  CSFM_BIND_ADDRESS:CSFM_PORT, plain HTTP. Bind it to an address only
#                your proxy can reach (e.g. the host's NetBird IP) and protect it there.
#   Agents       CSFM_AGENT_BIND:CSFM_AGENT_PORT_PUBLIC, TLS terminated by the app with
#                a self-issued certificate that agents pin. Expose this one to the
#                internet (or forward it through NAT); it serves only the agent API.
#
# Required: CSFM_DOMAIN, CSFM_BIND_ADDRESS, POSTGRES_PASSWORD, CSFM_SECRET_KEY,
#           CSFM_BACKUP_ENCRYPTION_KEY, CSFM_INITIAL_ADMIN_PASSWORD (first start only)
# Generate keys with: python -m app.cli keygen

services:
  db:
    image: postgres:16-alpine
    container_name: comsense-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: comsense
      POSTGRES_USER: comsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - comsense-db:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comsense -d comsense"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: ../server
    image: comsense-server:local
    container_name: comsense-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CSFM_DATABASE_URL: postgresql+psycopg://comsense:${POSTGRES_PASSWORD}@db:5432/comsense
      CSFM_PUBLIC_URL: https://${CSFM_DOMAIN:?CSFM_DOMAIN is required}
      CSFM_AGENT_URL: https://${CSFM_AGENT_DOMAIN:-${CSFM_DOMAIN}}:${CSFM_AGENT_PORT_PUBLIC:-8443}
      CSFM_AGENT_TLS_NAMES: ${CSFM_AGENT_TLS_NAMES:-}
      CSFM_SECRET_KEY: ${CSFM_SECRET_KEY:?CSFM_SECRET_KEY is required}
      CSFM_BACKUP_ENCRYPTION_KEY: ${CSFM_BACKUP_ENCRYPTION_KEY:?CSFM_BACKUP_ENCRYPTION_KEY is required}
      CSFM_INITIAL_ADMIN_USER: ${CSFM_INITIAL_ADMIN_USER:-admin}
      CSFM_INITIAL_ADMIN_PASSWORD: ${CSFM_INITIAL_ADMIN_PASSWORD:-}
      CSFM_CHECKIN_INTERVAL: ${CSFM_CHECKIN_INTERVAL:-60}
      CSFM_BACKUP_RETENTION_COUNT: ${CSFM_BACKUP_RETENTION_COUNT:-5}
      CSFM_METRICS_RETENTION_DAYS: ${CSFM_METRICS_RETENTION_DAYS:-30}
      CSFM_TASK_RETENTION_DAYS: ${CSFM_TASK_RETENTION_DAYS:-90}
    ports:
      - "${CSFM_BIND_ADDRESS:?CSFM_BIND_ADDRESS is required}:${CSFM_PORT:-3020}:8000"
      - "${CSFM_AGENT_BIND:-0.0.0.0}:${CSFM_AGENT_PORT_PUBLIC:-8443}:8443"
    volumes:
      - comsense-data:/var/lib/comsense
    networks:
      - internal
    labels:
      # Built locally, so there is nothing for Watchtower to pull.
      com.centurylinklabs.watchtower.enable: "false"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  comsense-db:
  comsense-data:

networks:
  internal: {}
