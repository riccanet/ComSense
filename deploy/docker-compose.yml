# ComSense server: PostgreSQL + application + Caddy (automatic HTTPS).
#
#   cp .env.example .env && edit .env
#   docker compose up -d
#
# Only Caddy is published. Firewalls connect to https://$CSFM_DOMAIN (port 443).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: comsense
      POSTGRES_USER: comsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comsense -d comsense"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ../server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      CSFM_DATABASE_URL: postgresql+psycopg://comsense:${POSTGRES_PASSWORD}@db:5432/comsense
      CSFM_PUBLIC_URL: https://${CSFM_DOMAIN:?set CSFM_DOMAIN in .env}
    volumes:
      - app-data:/var/lib/comsense

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      CSFM_DOMAIN: ${CSFM_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  app-data:
  caddy-data:
  caddy-config:
