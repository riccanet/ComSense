{% extends "base.html" %}
{% from "macros.html" import brand_lockup with context %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card narrow login">
  <div class="login-brand">{{ brand_lockup(44, "login") }}</div>
  <p class="muted">pfSense fleet management</p>
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Sign in</button>
  </form>
  {% if email_ready %}<p class="small forgot-link"><a href="/forgot">Forgot password?</a></p>{% endif %}
</section>
{% endblock %}
