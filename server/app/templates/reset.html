{% extends "login_base.html" %}
{% block title %}Set a new password{% endblock %}
{% block heading %}Set a new password{% endblock %}
{% block sub %}For {{ username }}{% endblock %}
{% block card %}
<form method="post" action="/reset/{{ token }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="f"><span>New password (12+ characters)</span><input type="password" name="new" minlength="12" autocomplete="new-password" required autofocus></label>
  <label class="f"><span>Confirm new password</span><input type="password" name="confirm" minlength="12" autocomplete="new-password" required></label>
  <button class="btn primary">Set password</button>
</form>
{% endblock %}
