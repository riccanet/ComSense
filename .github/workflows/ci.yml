name: CI

# Kept small on purpose (Actions minutes): only main and pull requests, only when code changes,
# superseded runs are cancelled, and the FreeBSD package build runs only when asked for.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      build_package:
        description: "Also build the .pkg on FreeBSD (the server builds the one firewalls download)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Which parts changed, so each test job runs only when it can be affected.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - "server/**"
              - ".github/workflows/**"
            agent:
              - "agent/**"
              - "server/**"
              - "deploy/**"
              - ".github/workflows/**"

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: csfm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r server/requirements-dev.txt
      - name: Server tests (SQLite)
        run: python -m pytest -q server/tests
      - name: Server tests (PostgreSQL, as in production)
        env:
          CSFM_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/csfm_test
        run: python -m pytest -q server/tests

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, zlib, simplexml, openssl
      - run: pip install -r server/requirements-dev.txt
      - name: Lint PHP
        run: find agent -name '*.php' -o -name '*.inc' | xargs -n1 php -l
      - name: Lint shell
        run: |
          sh -n agent/pfSense-pkg-ComSense/files/usr/local/sbin/comsense-agentd
          sh -n agent/pfSense-pkg-ComSense/files/usr/local/sbin/comsense-watchdogd
          sh -n agent/build-pkg.sh
          bash -n deploy/install-debian.sh
      - name: Agent end-to-end test (real agent code against real server over TLS)
        run: python -m pytest -q agent/tests

  package:
    # Builds the .pkg natively on FreeBSD 14 in a VM: slow, so only on request (Actions > CI >
    # Run workflow > "Also build the .pkg"). The server builds the package firewalls install.
    needs: agent
    if: github.event_name == 'workflow_dispatch' && inputs.build_package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.1"
          usesh: true
          run: |
            sh agent/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pfSense-pkg-ComSense
          path: agent/dist/*.pkg
