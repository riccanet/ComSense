name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: csfm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-dev.txt
      - name: Server tests (SQLite)
        run: python -m pytest -q server/tests
      - name: Server tests (PostgreSQL, as in production)
        env:
          CSFM_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/csfm_test
        run: python -m pytest -q server/tests

  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, zlib, simplexml, openssl
      - run: pip install -r server/requirements-dev.txt
      - name: Lint PHP
        run: find agent -name '*.php' -o -name '*.inc' | xargs -n1 php -l
      - name: Lint shell
        run: |
          sh -n agent/pfSense-pkg-ComSense/files/usr/local/sbin/comsense-agentd
          sh -n agent/build-pkg.sh
          bash -n deploy/install-debian.sh
      - name: Agent end-to-end test (real agent code against real server over TLS)
        run: python -m pytest -q agent/tests

  package:
    # Builds the installable .pkg on FreeBSD 14 (pfSense CE 2.7 / 2.8 ABI).
    runs-on: ubuntu-24.04
    needs: agent
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.1"
          usesh: true
          run: |
            sh agent/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pfSense-pkg-ComSense
          path: agent/dist/*.pkg
